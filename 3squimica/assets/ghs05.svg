<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="GHS05 — corrosão">
  <title>GHS05 — corrosão</title>
  <!-- Losango de sinalização: fundo branco, borda vermelha, símbolo preto -->
  <polygon points="50,3 97,50 50,97 3,50" fill="#FFFFFF" stroke="#D0021B" stroke-width="7" stroke-linejoin="round"/>

  <!-- Símbolo escalado e centrado para caber dentro do losango -->
  <g fill="#000000" transform="translate(20.6,20.8) scale(0.68)">

    <!-- ============ LADO ESQUERDO: ataque a uma superfície ============ -->

    <!-- Tubo de ensaio inclinado. A boca aponta para baixo e para a direita. -->
    <g transform="translate(23,28) rotate(160)">
      <path d="M-4.5,-11 h9 v15 a4.5,4.5 0 0 1 -9,0 z"/>
    </g>

    <!-- Jato caindo do tubo até a chapa -->
    <path d="M25.6,36.5 L28.2,36.5 L27.4,55 L25.2,55 Z"/>
    <!-- Respingo -->
    <circle cx="30.6" cy="50" r="1.5"/>

    <!-- Chapa em perspectiva, com a mordida da corrosão onde o jato bate -->
    <path d="M8,58 H44 L38,66 H2 Z"/>
    <path d="M2,66 H38 V70 H2 Z"/>
    <polygon points="22.5,58 26.4,50.5 30.3,58" fill="#FFFFFF"/>

    <!-- ================= LADO DIREITO: ataque à mão ================== -->

    <!-- Tubo de ensaio inclinado sobre a mão -->
    <g transform="translate(76,26) rotate(200)">
      <path d="M-4.5,-11 h9 v15 a4.5,4.5 0 0 1 -9,0 z"/>
    </g>

    <!-- Jato caindo do tubo até as costas da mão -->
    <path d="M71.4,34.5 L73.6,34.5 L73,49 L70.8,49 Z"/>

    <!-- Mão vista de cima: punho à direita, dedos apontando para a esquerda -->
    <path d="M84,58
             q0,-5 -6,-5
             h-9
             q-9,0 -13,3
             l-8,3 q-3,1.2 -3,3 t3,3
             l8,3 q4,3 13,3
             h9 q6,0 6,-5 z"/>
    <!-- Separação dos dedos, em branco, para a silhueta não virar bloco -->
    <g stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" fill="none">
      <line x1="56" y1="59" x2="68" y2="59"/>
      <line x1="58" y1="63" x2="68" y2="63"/>
      <line x1="60" y1="67" x2="68" y2="67"/>
    </g>
    <!-- Mordida da corrosão nas costas da mão -->
    <polygon points="70,56 74,48.5 78,56" fill="#FFFFFF"/>
  </g>
</svg>
