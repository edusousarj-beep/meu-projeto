<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="3S Química">
  <title>3S Química</title>
  <!-- Hexágono de anel vazado: aro grosso + núcleo sólido, com folga entre os
       dois. O aro segura a forma em escala de cinza e em impressão de uma cor,
       que era o defeito do símbolo anterior. -->
  <polygon points="50,8 86.37,29 86.37,71 50,92 13.63,71 13.63,29"
           fill="none" stroke="#1268E0" stroke-width="11" stroke-linejoin="round"/>
  <polygon points="50,28 69.05,39 69.05,61 50,72 30.95,61 30.95,39" fill="#1268E0"/>
</svg>
