<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="3S Química">
  <title>3S Química</title>
  <!-- Hexágono concêntrico de topo pontiagudo — versão monocromática.
       Usa currentColor: herda a cor do texto onde for embutida, o que
       serve para impressão em uma cor, fax, carimbo e documento fiscal. -->
  <g fill="none" stroke="currentColor" stroke-linejoin="round">
    <polygon points="50,3 90.7,26.5 90.7,73.5 50,97 9.3,73.5 9.3,26.5" stroke-width="6"/>
    <polygon points="50,20 76,35 76,65 50,80 24,65 24,35" stroke-width="6"/>
  </g>
  <polygon points="50,37 61.3,43.5 61.3,56.5 50,63 38.7,56.5 38.7,43.5" fill="currentColor"/>
</svg>
